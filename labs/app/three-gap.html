<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The three-gap theorem</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="lab.css"><script src="lab.js"></script>
</head>
<body>
<div class="app">
  <a class="ac-back" href="../three-gap.html" hidden>← Back to the notes</a>
  <div class="standalone"><h1>The three-gap theorem</h1><p class="sub">The points nα mod 1 never cut a circle into more than three lengths.</p></div>
<div class="row"><span class="lab">α</span><button type="button" data-a="golden">(√5−1)/2</button><button type="button" data-a="sqrt2">√2</button><button type="button" data-a="pi">π</button><button type="button" data-a="e">e</button><button type="button" data-a="r">7/23</button>
    <span class="lab" style="margin-left:.6rem">or type</span><input id="ga" type="text" value="" placeholder="0.3183" aria-label="Your own alpha"></div>
  <div class="row"><span class="lab">points N</span><input id="gn" type="range" min="1" max="200" value="1" aria-label="Number of points"><span id="gnv" class="val">1</span><button type="button" id="gplay">Play</button></div>
  <div class="stage" style="--ar:1;max-width:620px;margin-inline:auto"><canvas id="gc" aria-label="The points n times alpha modulo 1 on a circle, with the gaps between neighbours coloured by length"></canvas></div>
  <div class="readout" id="gr">…</div>
  <div class="legend"><span><i style="background:var(--plus)"></i>shortest gap</span><span><i style="background:var(--accent)"></i>middle gap</span><span><i style="background:var(--ink)"></i>longest gap (= shortest + middle when there are three)</span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("gc"),out=document.getElementById("gr"),nS=document.getElementById("gn"),nV=document.getElementById("gnv"),aIn=document.getElementById("ga");
var AL={golden:(Math.sqrt(5)-1)/2,sqrt2:Math.SQRT2,pi:Math.PI,e:Math.E,r:7/23},NAME={golden:"(√5−1)/2",sqrt2:"√2",pi:"π",e:"e",r:"7/23"};
var key="golden",alpha=AL.golden,N=1,geom,play=null,hover=-1,gapsCache=null;
function frac(x){return x-Math.floor(x);}
function compute(){var pts=[];for(var n=0;n<=N;n++)pts.push({n:n,t:frac(n*alpha)});
  var s=pts.slice().sort(function(a,b){return a.t-b.t||a.n-b.n;}).filter(function(q,i,arr){return i===0||q.t-arr[i-1].t>1e-12;}),gaps=[];
  for(var i=0;i<s.length;i++){var a=s[i],b=s[(i+1)%s.length],g=frac(b.t-a.t+1);if(s.length===1)g=1;gaps.push({from:a,to:b,len:g});}
  var lens=[];gaps.forEach(function(g){if(!lens.some(function(L){return Math.abs(L.v-g.len)<1e-9;}))lens.push({v:g.len,c:0});});
  lens.sort(function(a,b){return a.v-b.v;});gaps.forEach(function(g){for(var k=0;k<lens.length;k++)if(Math.abs(lens[k].v-g.len)<1e-9){g.cls=k;lens[k].c++;}});
  gapsCache={pts:pts,gaps:gaps,lens:lens};}
function colors(k,n){var plus=Lab.css("--plus"),acc=Lab.css("--accent"),ink=Lab.css("--ink");if(n===1)return acc;if(n===2)return[plus,acc][k];return[plus,acc,ink][k];}
function draw(){
  if(!geom)geom=Lab.setup(cv);var c=geom.ctx,W=geom.w,H=geom.h;c.clearRect(0,0,W,H);
  var G=gapsCache,cx=W/2,cy=H*0.43,R=Math.min(W,H)*0.33,mut=Lab.css("--muted"),rule=Lab.css("--rule"),ink=Lab.css("--ink"),card=Lab.css("--card");
  c.strokeStyle=rule;c.lineWidth=1;c.beginPath();c.arc(cx,cy,R,0,6.2832);c.stroke();
  function ang(t){return -Math.PI/2+t*2*Math.PI;}
  G.gaps.forEach(function(g,i){var a0=ang(g.from.t),a1=a0+g.len*2*Math.PI;c.strokeStyle=colors(g.cls,G.lens.length);c.lineWidth=i===hover?11:7;c.lineCap="butt";c.beginPath();c.arc(cx,cy,R,a0+0.004,a1-0.004);c.stroke();});
  var rd=Math.max(2,Math.min(5,60/Math.sqrt(N+1)));
  G.pts.forEach(function(p){var a=ang(p.t);c.fillStyle=p.n===N?Lab.css("--accent"):ink;c.beginPath();c.arc(cx+R*Math.cos(a),cy+R*Math.sin(a),p.n===N?rd+2:rd,0,6.2832);c.fill();
    if(N<=24){c.fillStyle=mut;c.font=Lab.font(10);c.textAlign="center";c.fillText(String(p.n),cx+(R+16)*Math.cos(a),cy+(R+16)*Math.sin(a)+3);}});
  c.fillStyle=ink;c.font=Lab.font(13,600);c.textAlign="center";c.fillText(G.lens.length+(G.lens.length===1?" gap length":" gap lengths"),cx,cy-6);
  c.fillStyle=mut;c.font=Lab.font(11);c.fillText("N = "+N,cx,cy+14);
  // unrolled interval [0,1)
  var L=30,Rr=W-30,y=H*0.86;c.fillStyle=mut;c.font=Lab.font(10);c.textAlign="center";c.fillText("0",L,y+20);c.fillText("1",Rr,y+20);
  G.gaps.forEach(function(g,i){var x0=L+(Rr-L)*g.from.t,x1=x0+(Rr-L)*g.len;c.fillStyle=colors(g.cls,G.lens.length);
    if(x1<=Rr+0.5)c.fillRect(x0+0.6,y-(i===hover?8:6),Math.max(0.5,x1-x0-1.2),i===hover?16:12);else{c.fillRect(x0+0.6,y-6,Rr-x0-0.6,12);c.fillRect(L,y-6,x1-Rr-0.6,12);}});
  G.pts.forEach(function(p){var x=L+(Rr-L)*p.t;c.fillStyle=card;c.fillRect(x-0.75,y-9,1.5,18);});
}
function fmt(v){return v.toFixed(6);}
function report(){var G=gapsCache,ls=G.lens,s="α = "+NAME[key]+(key==="own"?"":"")+" ≈ "+alpha.toFixed(6)+",  points 0·α, 1·α, …, "+N+"·α (mod 1)\n";
  if(hover>=0){var g=G.gaps[hover];out.textContent=s+"gap from "+g.from.n+"α to "+g.to.n+"α: length "+fmt(g.len);return;}
  s+="gap lengths: "+ls.map(function(L){return fmt(L.v)+" ×"+L.c;}).join(",  ");
  if(ls.length===3)s+="\ncheck: "+fmt(ls[0].v)+" + "+fmt(ls[1].v)+" = "+fmt(ls[0].v+ls[1].v)+"  (the longest gap)";
  else s+="\n"+(ls.length===2?"two lengths: the next point will split a longest gap":"one length");
  out.textContent=s;}
function update(){N=+nS.value;nV.textContent=N;compute();hover=-1;draw();report();}
function setAlpha(k,v){key=k;alpha=v;Lab.pressed("[data-a]",function(b){return b.dataset.a===k;});update();}
document.querySelectorAll("[data-a]").forEach(function(b){b.addEventListener("click",function(){aIn.value="";setAlpha(b.dataset.a,AL[b.dataset.a]);});});
aIn.addEventListener("change",function(){var v=parseFloat(aIn.value);if(isFinite(v)){NAME.own=aIn.value;setAlpha("own",v);}});
nS.addEventListener("input",function(){stopPlay();update();});
function stopPlay(){if(play){clearTimeout(play);play=null;}document.getElementById("gplay").textContent="Play";}
document.getElementById("gplay").addEventListener("click",function(){if(play){stopPlay();return;}this.textContent="Pause";if(+nS.value>=+nS.max)nS.value=1;
  (function tick(){if(+nS.value>=+nS.max){stopPlay();return;}nS.value=+nS.value+1;update();play=setTimeout(tick,Lab.reduce?400:(N<12?650:N<40?260:90));})();});
cv.addEventListener("pointermove",function(ev){var p=Lab.local(cv,ev),W=geom.w,H=geom.h,cx=W/2,cy=H*0.43,R=Math.min(W,H)*0.33,G=gapsCache,h=-1;
  var d=Math.hypot(p[0]-cx,p[1]-cy);if(Math.abs(d-R)<14){var t=frac((Math.atan2(p[1]-cy,p[0]-cx)+Math.PI/2)/(2*Math.PI));G.gaps.forEach(function(g,i){var u=frac(t-g.from.t);if(u<g.len)h=i;});}
  else if(Math.abs(p[1]-H*0.86)<12){var t2=(p[0]-30)/(W-60);G.gaps.forEach(function(g,i){var u=frac(t2-g.from.t);if(u<g.len&&t2>=0&&t2<1)h=i;});}
  if(h!==hover){hover=h;draw();report();}});
cv.addEventListener("pointerleave",function(){hover=-1;draw();report();});
Lab.onTheme(draw);window.addEventListener("resize",function(){geom=Lab.setup(cv);draw();});
setAlpha("golden",AL.golden);document.getElementById("gplay").click();
})();
</script>
</body>
</html>
