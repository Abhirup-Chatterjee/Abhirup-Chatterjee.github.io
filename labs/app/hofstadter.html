<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hofstadter's butterfly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="lab.css"><script src="lab.js"></script>
</head>
<body>
<div class="app">
  <a class="ac-back" href="../hofstadter.html" hidden>← Back to the notes</a>
  <div class="standalone"><h1>Hofstadter's butterfly</h1><p class="sub">The spectrum of the almost Mathieu operator against the magnetic flux.</p></div>
<div class="row"><span class="lab">largest q</span><input id="hq" type="range" min="5" max="60" value="40" aria-label="Largest denominator q"><span id="hqv" class="val">40</span>
    <span class="grow"></span><span class="lab">highlight</span><button type="button" data-h="none">nothing</button><button type="button" data-h="fib">Fibonacci ratios → golden</button><button type="button" data-h="one">α = 1/q</button></div>
  <div class="stage" style="--ar:1;max-width:660px;margin-inline:auto"><canvas id="hc" aria-label="Hofstadter's butterfly: the spectrum of an electron on a square lattice in a magnetic field, plotted against the flux"></canvas></div>
  <div class="readout" id="hr">…</div>
  <div class="legend"><span><i style="background:var(--accent)"></i>allowed energies (bands)</span><span><i style="background:var(--plus)"></i>highlighted rows</span><span>horizontal: energy E ∈ [−4, 4] · vertical: flux α ∈ [0, 1]</span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("hc"),out=document.getElementById("hr"),qS=document.getElementById("hq"),qV=document.getElementById("hqv");
var Q=40,geom,rows=[],hi="none",hoverRow=null,job=null;
function gcd(a,b){while(b){var t=a%b;a=b;b=t;}return a;}
function bandsFor(p,q,M){ // returns Uint8Array of length M marking energies E in the spectrum, via the trace of the transfer matrix (Chambers)
  var a=p/q,th=Math.PI/(2*q),cs=new Float64Array(q);for(var n=1;n<=q;n++)cs[n-1]=2*Math.cos(2*Math.PI*a*n+th);
  var mark=new Uint8Array(M),prev=null;
  for(var i=0;i<M;i++){var E=-4.2+8.4*i/(M-1),m11=1,m12=0,m21=0,m22=1;
    for(var k=0;k<q;k++){var d=E-cs[k],n11=d*m11-m21,n12=d*m12-m22;m21=m11;m22=m12;m11=n11;m12=n12;}
    var tr=m11+m22;if(Math.abs(tr)<=4)mark[i]=1;
    if(prev!==null&&!mark[i]&&!mark[i-1]){if((prev>4&&tr<-4)||(prev<-4&&tr>4)||(prev-4)*(tr-4)<0||(prev+4)*(tr+4)<0)mark[i]=1;}
    prev=tr;}
  return mark;}
function frame(){var W=geom.w,H=geom.h,L=42,R=W-10,T=10,B=H-30;return{W:W,H:H,L:L,R:R,T:T,B:B,M:Math.round(R-L)};}
function compute(){if(job)cancelAnimationFrame(job);rows=[];var F=frame(),list=[];
  for(var q=1;q<=Q;q++)for(var p=0;p<=q;p++)if(gcd(p,q)===1)list.push([p,q]);
  var i=0;(function step(){var t0=performance.now();while(i<list.length&&performance.now()-t0<24){var pq=list[i++];rows.push({p:pq[0],q:pq[1],mark:bandsFor(pq[0],pq[1],F.M)});}
    draw();report();if(i<list.length)job=requestAnimationFrame(step);else job=null;})();}
function isHi(r){if(hi==="fib"){var f=[1,1];while(f[f.length-1]<200)f.push(f[f.length-1]+f[f.length-2]);for(var k=1;k<f.length-1;k++)if(r.p===f[k]&&r.q===f[k+1])return true;return false;}
  if(hi==="one")return r.p===1&&r.q>1;return false;}
function draw(){
  if(!geom)geom=Lab.setup(cv);var c=geom.ctx,F=frame();c.clearRect(0,0,F.W,F.H);
  var acc=Lab.css("--accent"),plus=Lab.css("--plus"),mut=Lab.css("--muted"),rule=Lab.css("--rule"),ink=Lab.css("--ink");
  c.strokeStyle=rule;c.strokeRect(F.L-.5,F.T-.5,F.R-F.L+1,F.B-F.T+1);
  var th=Math.max(1,Math.min(2.2,(F.B-F.T)/(Q*Q*0.32)));
  rows.forEach(function(r){var y=F.B-(F.B-F.T)*r.p/r.q,h=isHi(r)||(hoverRow&&r===hoverRow);c.fillStyle=h?plus:acc;c.globalAlpha=h?1:0.85;
    var run=-1;for(var i=0;i<=F.M;i++){var on=i<F.M&&r.mark[i];if(on&&run<0)run=i;if(!on&&run>=0){c.fillRect(F.L+run,y-th/2-(h?.6:0),Math.max(1,i-run),th+(h?1.2:0));run=-1;}}});
  c.globalAlpha=1;c.font=Lab.font(10);c.fillStyle=mut;c.textAlign="center";
  [-4,-2,0,2,4].forEach(function(E){c.fillText(String(E),F.L+(E+4.2)/8.4*(F.R-F.L),F.B+14);});c.fillText("energy E",(F.L+F.R)/2,F.B+26);
  c.textAlign="right";["0","½","1"].forEach(function(l,i){c.fillText(l,F.L-6,F.B-(F.B-F.T)*i/2+3);});
  c.save();c.translate(9,(F.T+F.B)/2);c.rotate(-Math.PI/2);c.textAlign="center";c.fillText("flux α",0,0);c.restore();
}
function report(){if(hoverRow){var r=hoverRow,F=frame(),cnt=0,bands=0;for(var i=0;i<F.M;i++){if(r.mark[i]){cnt++;if(!i||!r.mark[i-1])bands++;}}
    out.textContent="α = "+r.p+"/"+r.q+":  the spectrum splits into "+r.q+" bands"+(r.q%2===0&&r.q>1?" (the two central ones touch at E = 0)":"")+"\nvisible bands at this resolution: "+bands+"   ·   total width ≈ "+(cnt/F.M*8.4).toFixed(3)+"   ·   for comparison 9.33/q = "+(9.33/r.q).toFixed(3);return;}
  out.textContent="all fractions p/q with q ≤ "+Q+": "+rows.length+" rows\nfor α = p/q the allowed energies form q bands; for irrational α they form a Cantor set of measure zero (the Ten Martini problem)\nhover over a row to inspect it";}
qS.addEventListener("input",function(){Q=+qS.value;qV.textContent=Q;});qS.addEventListener("change",function(){compute();});
document.querySelectorAll("[data-h]").forEach(function(b){b.addEventListener("click",function(){hi=b.dataset.h;Lab.pressed("[data-h]",function(x){return x.dataset.h===hi;});draw();});});
cv.addEventListener("pointermove",function(ev){var p=Lab.local(cv,ev),F=frame(),best=null,bd=6;rows.forEach(function(r){var y=F.B-(F.B-F.T)*r.p/r.q,d=Math.abs(y-p[1])+(r.q>12?0.8:0);if(d<bd){bd=d;best=r;}});if(best!==hoverRow){hoverRow=best;draw();report();}});
cv.addEventListener("pointerleave",function(){hoverRow=null;draw();report();});
Lab.onTheme(draw);var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){geom=Lab.setup(cv);compute();},150);});
Lab.pressed("[data-h]",function(x){return x.dataset.h===hi;});geom=Lab.setup(cv);compute();
})();
</script>
</body>
</html>
