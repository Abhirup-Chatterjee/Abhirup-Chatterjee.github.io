<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The p-adic integers as a fractal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="lab.css"><script src="lab.js"></script>
</head>
<body>
<div class="app">
  <a class="ac-back" href="../p-adic.html" hidden>← Back to the notes</a>
  <div class="standalone"><h1>The p-adic integers as a fractal</h1><p class="sub">Nested discs for ℤₚ, and sequences that converge p-adically.</p></div>
<div class="row"><span class="lab">prime p</span><button type="button" data-p="2">2</button><button type="button" data-p="3">3</button><button type="button" data-p="5">5</button><button type="button" data-p="7">7</button></div>
  <div class="row"><span class="lab">sequence</span><button type="button" data-s="minus1">pᵏ − 1 → −1</button><button type="button" data-s="geom">1 + p + ⋯ + pᵏ → 1/(1−p)</button><button type="button" data-s="teich">a^(pᵏ) → root of unity</button><button type="button" data-s="sqrt">Hensel: a square root</button><button type="button" data-s="fact">k! → 0</button></div>
  <div class="row"><button type="button" id="pplay">Replay</button><span class="lab" style="margin-left:.4rem">nested discs: the last base-p digit picks the big disc, the next digit the disc inside it, …</span></div>
  <div class="stage" style="--ar:1;max-width:640px;margin-inline:auto"><canvas id="pac" aria-label="The p-adic integers drawn as nested discs, with a sequence converging p-adically"></canvas></div>
  <div class="readout" id="par">…</div>
  <div class="legend"><span><i class="sq" style="background:var(--zero)"></i>residues mod pᴰ</span><span><i class="sq" style="background:var(--accent)"></i>terms of the sequence</span><span><i style="background:var(--plus)"></i>path from term to term</span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("pac"),out=document.getElementById("par");
var p=5,seqKey="sqrt",D=5,terms=[],shown=0,geom,anim=null,hov=null;
var RAT={2:0.42,3:0.36,5:0.31,7:0.27};
function depthFor(p){return p===2?8:p===3?6:p===5?5:4;}
function digitsOf(m){var d=[],P=BigInt(p);m=((m%PD())+PD())%PD();for(var i=0;i<D;i++){d.push(Number(m%P));m/=P;}return d;}
function PD(){return BigInt(p)**BigInt(D);}
function val(x){if(x===0n)return Infinity;var v=0,P=BigInt(p);if(x<0n)x=-x;while(x%P===0n){x/=P;v++;}return v;}
function buildSeq(){var P=BigInt(p),t=[],k,M=PD()*P*P;
  if(seqKey==="minus1"){for(k=1;k<=D+2;k++)t.push({v:P**BigInt(k)-1n,lab:p+"^"+k+" − 1"});}
  else if(seqKey==="geom"){var s=0n;for(k=0;k<=D+2;k++){s+=P**BigInt(k);t.push({v:s,lab:"1 + … + "+p+"^"+k});}}
  else if(seqKey==="teich"){var a=p===2?3n:2n,e=1n;for(k=0;k<=D+1;k++){var x=1n,b=a,ee=e;while(ee>0n){if(ee&1n)x=x*b%M;b=b*b%M;ee>>=1n;}t.push({v:x,lab:a+"^("+p+"^"+k+")"});e*=P;}}
  else if(seqKey==="sqrt"){var A={2:-7n,3:7n,5:-1n,7:2n}[p],x0={2:1n,3:1n,5:2n,7:3n}[p],xk=x0,mod=p===2?8n:P;
    t.push({v:xk,lab:"x₁ = "+xk+"  (x² ≡ "+A+" mod "+mod+")"});
    for(k=2;k<=D+1;k++){mod=p===2?P**BigInt(k+2):P**BigInt(k);
      if(p===2){ // lift: if x^2 - A not divisible by 2^(k+2), add 2^(k)
        var m2=mod; if(((xk*xk-A)%m2+m2)%m2!==0n)xk=xk+P**BigInt(k);}
      else{var f=(xk*xk-A),inv=modInv((2n*xk)%mod,mod);xk=((xk-f*inv)%mod+mod)%mod;}
      t.push({v:xk,lab:"x"+sub(k)+" = "+xk});}}
  else{var f2=1n;for(k=1;k<=16;k++){f2*=BigInt(k);t.push({v:f2,lab:k+"!"});}}
  terms=t;}
function sub(n){return Lab.sub(n);}
function modInv(a,m){var g=m,x=0n,x1=1n,aa=((a%m)+m)%m;while(aa){var q=g/aa;var t=g-q*aa;g=aa;aa=t;t=x-q*x1;x=x1;x1=t;}return ((x%m)+m)%m;}
function frame(){var W=geom.w,H=geom.h;return{W:W,H:H,cx:W/2,cy:H/2,R:Math.min(W,H)/2-10};}
function place(d,F){var x=F.cx,y=F.cy,r=F.R*(1-RAT[p])*0.98,rr=F.R;
  for(var j=0;j<d.length;j++){var a=-Math.PI/2+2*Math.PI*d[j]/p;x+=rr*(1-RAT[p])*Math.cos(a);y+=rr*(1-RAT[p])*Math.sin(a);rr*=RAT[p];}
  return[x,y,rr];}
function draw(){
  if(!geom)geom=Lab.setup(cv);var c=geom.ctx,F=frame();c.clearRect(0,0,F.W,F.H);
  var rule=Lab.css("--rule"),zero=Lab.css("--zero"),acc=Lab.css("--accent"),plus=Lab.css("--plus"),ink=Lab.css("--ink"),mut=Lab.css("--muted");
  // discs for levels 1..min(D,3)
  function discs(prefix,level){if(level>Math.min(D,4))return;for(var dgt=0;dgt<p;dgt++){var d=prefix.concat([dgt]),P=place(d,F);c.strokeStyle=rule;c.globalAlpha=level===1?1:0.7;c.lineWidth=level===1?1.2:0.8;c.beginPath();c.arc(P[0],P[1],P[2]*1.02,0,6.2832);c.stroke();
    if(level===1){c.globalAlpha=1;c.fillStyle=mut;c.font=Lab.font(11);var a=-Math.PI/2+2*Math.PI*dgt/p;c.textAlign="center";c.fillText("…"+dgt,F.cx+(F.R-2)*Math.cos(a)*1.0+(Math.cos(a)>0.3?-6:Math.cos(a)<-0.3?6:0),F.cy+(F.R)*Math.sin(a)*0.98+(Math.sin(a)<0?12:-4));}discs(d,level+1);}c.globalAlpha=1;}
  discs([],1);
  // all residues mod p^D as tiny dots
  var total=Math.pow(p,D),dr=Math.max(0.7,Math.min(2,F.R*Math.pow(RAT[p],D)*0.9));c.fillStyle=zero;
  for(var m=0;m<total;m++){var d=[],mm=m;for(var j=0;j<D;j++){d.push(mm%p);mm=Math.floor(mm/p);}var P=place(d,F);c.fillRect(P[0]-dr,P[1]-dr,2*dr,2*dr);}
  // sequence
  var pts=terms.slice(0,shown).map(function(t){return place(digitsOf(t.v),F);});
  c.strokeStyle=plus;c.lineWidth=1.3;c.globalAlpha=.75;c.beginPath();pts.forEach(function(P,i){if(i)c.lineTo(P[0],P[1]);else c.moveTo(P[0],P[1]);});c.stroke();c.globalAlpha=1;
  pts.forEach(function(P,i){c.fillStyle=i===pts.length-1?acc:Lab.mix(acc,Lab.css("--card"),0.35);c.beginPath();c.arc(P[0],P[1],i===pts.length-1?5.5:3.5,0,6.2832);c.fill();});
  if(hov){c.strokeStyle=ink;c.lineWidth=1.4;c.beginPath();c.arc(hov.P[0],hov.P[1],7,0,6.2832);c.stroke();}
}
function digStr(x){var d=digitsOf(x);return "…"+d.slice().reverse().join("")+Lab.sub(p);}
function report(){
  if(hov){out.textContent="residue "+hov.m+" mod "+p+"^"+D+" = "+PD()+"   ·   base "+p+": "+digStr(BigInt(hov.m))+"\nnearby points agree in their last digits: being close in ℤ"+Lab.sub(p)+" means differing by a high power of "+p;return;}
  var k=Math.max(0,shown-1),t=terms[k];if(!t){out.textContent="…";return;}
  var line="term "+(k+1)+":  "+t.lab+"   ≡ "+digStr(t.v)+"  (last "+D+" base-"+p+" digits)";
  var dist="";if(k>0){var v=val(t.v-terms[k-1].v);dist="\ndistance to the previous term: |difference|"+Lab.sub(p)+" = "+(v===Infinity?"0":p+"^−"+v+" = "+Math.pow(p,-v).toPrecision(3));}
  var lim={minus1:"limit −1 = …"+String(p-1).repeat(D)+Lab.sub(p),geom:"limit 1/(1−"+p+") = …"+"1".repeat(D)+Lab.sub(p),teich:"limit: a root of unity of order dividing "+(p===2?2:p-1)+" (Teichmüller)",sqrt:"limit: a "+p+"-adic square root of "+({2:-7,3:7,5:-1,7:2})[p]+" (Hensel's lemma)",fact:"limit 0: the power of "+p+" in k! grows like k/("+p+"−1) (Legendre)"}[seqKey];
  out.textContent=line+dist+"\n"+lim;}
function play(){if(anim)clearTimeout(anim);shown=0;(function t(){shown++;draw();report();if(shown<terms.length)anim=setTimeout(t,Lab.reduce?60:700);else anim=null;})();}
function setAll(){D=depthFor(p);buildSeq();Lab.pressed("[data-p]",function(b){return +b.dataset.p===p;});Lab.pressed("[data-s]",function(b){return b.dataset.s===seqKey;});hov=null;play();}
document.querySelectorAll("[data-p]").forEach(function(b){b.addEventListener("click",function(){p=+b.dataset.p;setAll();});});
document.querySelectorAll("[data-s]").forEach(function(b){b.addEventListener("click",function(){seqKey=b.dataset.s;setAll();});});
document.getElementById("pplay").addEventListener("click",play);
cv.addEventListener("pointermove",function(ev){var q=Lab.local(cv,ev),F=frame(),d=[],x=F.cx,y=F.cy,rr=F.R;
  for(var j=0;j<D;j++){var best=-1,bd=1e9;for(var g=0;g<p;g++){var a=-Math.PI/2+2*Math.PI*g/p,X=x+rr*(1-RAT[p])*Math.cos(a),Y=y+rr*(1-RAT[p])*Math.sin(a),dd=(X-q[0])*(X-q[0])+(Y-q[1])*(Y-q[1]);if(dd<bd){bd=dd;best=g;}}
    var a2=-Math.PI/2+2*Math.PI*best/p;x+=rr*(1-RAT[p])*Math.cos(a2);y+=rr*(1-RAT[p])*Math.sin(a2);rr*=RAT[p];d.push(best);}
  if(Math.hypot(q[0]-F.cx,q[1]-F.cy)>F.R){if(hov){hov=null;draw();report();}return;}
  var m=0;for(j=D-1;j>=0;j--)m=m*p+d[j];if(!hov||hov.m!==m){hov={m:m,P:[x,y]};draw();report();}});
cv.addEventListener("pointerleave",function(){hov=null;draw();report();});
Lab.onTheme(draw);window.addEventListener("resize",function(){geom=Lab.setup(cv);draw();});
setAll();
})();
</script>
</body>
</html>
