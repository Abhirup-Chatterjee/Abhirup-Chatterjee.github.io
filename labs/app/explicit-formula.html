852,529.806226319,530.866917884,532.688183028,533.779630754,535.664314076,537.069759083,538.428526176,540.213166376,540.631390247,541.847437121];
var root=document.documentElement;
var css=Lab.css;
var cv=document.getElementById("zc"),out=document.getElementById("zr"),slider=document.getElementById("zn"),nv=document.getElementById("znv");
var X=60,Nz=0,geom,xs,base,partial,psiTrue,ppList,hoverX=null,anim=null;
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
Lab.onTheme(function(){draw();});
// prime powers up to X with log p
function primePowers(lim){var sieve=new Uint8Array(lim+1),out=[];for(var i=2;i<=lim;i++){if(!sieve[i]){for(var j=i*i;j<=lim;j+=i)sieve[j]=1;for(var q=i,k=1;q<=lim;q*=i,k++)out.push({n:q,p:i,k:k});}}out.sort(function(a,b){return a.n-b.n;});return out;}
function psiAt(x){var s=0;for(var i=0;i<ppList.length&&ppList[i].n<=x;i++)s+=Math.log(ppList[i].p);return s;}
function wave(x,g){var L=Math.log(x);return 2*Math.sqrt(x)*(0.5*Math.cos(g*L)+g*Math.sin(g*L))/(0.25+g*g);}
function layout(){
  var dpr=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||500,h=cv.clientHeight||500;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);var c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);geom={ctx:c,w:w,h:h};
  build();}
function build(){
  ppList=primePowers(X+1);
  var M=Math.round(geom.w*2.5);xs=new Float64Array(M);base=new Float64Array(M);psiTrue=new Float64Array(M);
  var x0=1.02;for(var i=0;i<M;i++){var x=x0+(X-x0)*i/(M-1);xs[i]=x;base[i]=x-Math.log(2*Math.PI)-0.5*Math.log(1-1/(x*x));psiTrue[i]=psiAt(x);}
  // cumulative sums: partial[k] holds sum over the first k zeros (computed lazily up to 300)
  partial=[new Float64Array(M)];
  for(var k=1;k<=GAMMA.length;k++){var prev=partial[k-1],cur=new Float64Array(M),g=GAMMA[k-1];for(i=0;i<M;i++)cur[i]=prev[i]+wave(xs[i],g);partial.push(cur);}
}
function draw(){
  if(!geom)layout();var c=geom.ctx,W=geom.w,H=geom.h;c.clearRect(0,0,W,H);
  var ink=css("--ink"),soft=css("--ink-soft"),mut=css("--muted"),rule=css("--rule"),acc=css("--accent"),plus=css("--plus"),f=css("--f-mono");
  var L=34,R=W-10,T=16,B=H*0.78,WT=H*0.87,WB=H-18,ymax=X*1.12,ymin=-X*0.06;
  function px(x){return L+(R-L)*(x-1)/(X-1);}function py(y){return B-(B-T)*(y-ymin)/(ymax-ymin);}
  // grid + axes
  c.font="10px "+f;c.fillStyle=mut;c.strokeStyle=rule;c.lineWidth=1;
  var step=X<=30?5:X<=60?10:20;
  for(var v=0;v<=X;v+=step){var yy=py(v);c.globalAlpha=.5;c.beginPath();c.moveTo(L,yy+.5);c.lineTo(R,yy+.5);c.stroke();c.globalAlpha=1;c.textAlign="right";c.fillText(String(v),L-5,yy+3);
    if(v>=step||v===0){var xx=px(Math.max(v,1));c.textAlign="center";c.fillText(String(Math.max(v,1)),xx,B+13);}}
  // prime ticks on the axis
  ppList.forEach(function(q){if(q.n>X)return;var xx=px(q.n);c.strokeStyle=q.k===1?acc:mut;c.globalAlpha=q.k===1?.9:.6;c.beginPath();c.moveTo(xx,B+1);c.lineTo(xx,B+(q.k===1?6:4));c.stroke();c.globalAlpha=1;});
  // y = x guide
  c.setLineDash([3,4]);c.strokeStyle=rule;c.beginPath();c.moveTo(px(1),py(1));c.lineTo(px(X),py(X));c.stroke();c.setLineDash([]);
  // true staircase
  c.strokeStyle=soft;c.lineWidth=1.4;c.beginPath();var lastY=0;c.moveTo(px(1),py(0));
  ppList.forEach(function(q){if(q.n>X)return;c.lineTo(px(q.n),py(lastY));lastY+=Math.log(q.p);c.lineTo(px(q.n),py(lastY));});c.lineTo(px(X),py(lastY));c.stroke();
  // approximation with Nz zeros (fractional Nz blends the newest wave in)
  var k=Math.floor(Nz),fr=Nz-k,Pk=partial[k],Pk1=partial[Math.min(k+1,GAMMA.length)];
  c.save();c.beginPath();c.rect(L,T,R-L,B-T);c.clip();
  c.strokeStyle=acc;c.lineWidth=1.6;c.beginPath();
  for(var i=0;i<xs.length;i++){var val=base[i]-(Pk[i]+(Pk1[i]-Pk[i])*fr),X1=px(xs[i]),Y1=py(val);if(i)c.lineTo(X1,Y1);else c.moveTo(X1,Y1);}c.stroke();c.restore();
  // newest wave strip
  var kk=Math.max(1,Math.ceil(Nz));
  c.fillStyle=mut;c.textAlign="left";c.fillText(Nz>0?"wave of zero #"+kk+":  γ = "+GAMMA[kk-1].toFixed(6):"no zeros yet: the curve is y = x − log 2π − ½ log(1 − x⁻²)",L,WT-4);
  c.strokeStyle=rule;c.beginPath();var mid=(WT+WB)/2;c.moveTo(L,mid+.5);c.lineTo(R,mid+.5);c.stroke();
  if(Nz>0){var g=GAMMA[kk-1],amp=0;for(i=0;i<xs.length;i+=4)amp=Math.max(amp,Math.abs(wave(xs[i],g)));
    c.strokeStyle=plus;c.lineWidth=1.2;c.beginPath();for(i=0;i<xs.length;i++){var wv=-wave(xs[i],g)/amp,X2=px(xs[i]),Y2=mid-wv*(WB-WT)/2*0.9;if(i)c.lineTo(X2,Y2);else c.moveTo(X2,Y2);}c.stroke();}
  // hover
  if(hoverX!==null){var hx=px(hoverX);c.strokeStyle=ink;c.globalAlpha=.35;c.beginPath();c.moveTo(hx,T);c.lineTo(hx,B);c.stroke();c.globalAlpha=1;}
}
function idxOf(x){return Math.max(0,Math.min(xs.length-1,Math.round((x-xs[0])/(xs[xs.length-1]-xs[0])*(xs.length-1))));}
function report(){
  var k=Math.round(Nz);
  if(hoverX!==null){var i=idxOf(hoverX),x=xs[i],approx=base[i]-partial[k][i],tru=psiTrue[i],near=null,bd=1e9;
    ppList.forEach(function(q){var d=Math.abs(q.n-x);if(d<bd){bd=d;near=q;}});
    var nearS=near?(near.k===1?near.n+" is prime: ψ jumps by log "+near.p+" = "+Math.log(near.p).toFixed(3):near.n+" = "+near.p+(near.k===2?"²":near.k===3?"³":near.k===4?"⁴":near.k===5?"⁵":"^"+near.k)+": ψ jumps by log "+near.p+" = "+Math.log(near.p).toFixed(3)):"";
    out.textContent="x = "+x.toFixed(2)+"   ·   ψ(x) = "+tru.toFixed(3)+"   ·   from "+k+" zeros: "+approx.toFixed(3)+"\nnearest prime power: "+nearS;return;}
  out.textContent=(k?"using the first "+k+" zeros ρ = ½ + iγ, up to γ = "+GAMMA[k-1].toFixed(3):"using no zeros: just the main term x")+"\nmove the slider, or hover over the graph to compare with ψ(x) = Σ log p over prime powers pᵏ ≤ x";}
function setN(n){Nz=n;var k=Math.round(n);slider.value=k;nv.textContent=k;draw();report();}
slider.addEventListener("input",function(){if(anim){cancelAnimationFrame(anim);anim=null;}setN(+slider.value);});
function play(){if(anim)cancelAnimationFrame(anim);if(reduce){setN(GAMMA.length);return;}var t0=null,dur=14000;
  function fr(t){if(t0===null)t0=t;var u=Math.min(1,(t-t0)/dur);
    // first 12 zeros one at a time, then speed up through the rest
    var n=u<.35?Math.floor(u/.35*12)+1:12+(GAMMA.length-12)*Math.pow((u-.35)/.65,2);
    setN(Math.min(GAMMA.length,n));if(u<1)anim=requestAnimationFrame(fr);else anim=null;}
  anim=requestAnimationFrame(fr);}
document.getElementById("zplay").addEventListener("click",play);
function setX(x){X=x;document.querySelectorAll("[data-x]").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.x===X));});build();draw();report();}
document.querySelectorAll("[data-x]").forEach(function(b){b.addEventListener("click",function(){setX(+b.dataset.x);});});
cv.addEventListener("pointermove",function(ev){var r=cv.getBoundingClientRect(),x=ev.clientX-r.left,L=34,R=r.width-10;if(x<L||x>R){hoverX=null;}else hoverX=1+(X-1)*(x-L)/(R-L);draw();report();});
cv.addEventListener("pointerleave",function(){hoverX=null;draw();report();});
window.addEventListener("resize",function(){layout();draw();});
layout();setX(60);play();
})();
